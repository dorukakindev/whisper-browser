<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="assistant-overlay.css"><title>Assistant</title></head>
<body><button id="bubble" aria-label="Open assistant" title="Assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-8 8H5l-3 2v-10a9 9 0 0 1 18 0Z"/><path d="M7 10h10M7 14h6"/></svg></button>
<section id="panel" hidden aria-label="Assistant">
<header><span class="assistant-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 11.5a8 8 0 0 1-8 8H5l-3 2v-10a9 9 0 0 1 18 0Z"/><path d="M7 10h10M7 14h6"/></svg></span><div><strong id="title">Assistant</strong><small id="context"></small></div><button id="expand" class="icon-button" title="Expand" aria-label="Expand">↗</button><button id="close" class="icon-button" title="Minimize" aria-label="Minimize">×</button></header>
<details id="sourceBox"><summary id="sourceLabel">Source &amp; model</summary><strong id="modelName"></strong><p id="sourceDescription"></p></details>
<div id="threadBar"><select id="threads" aria-label="Conversation"></select><button id="newThread" type="button">New</button><details id="conversationMenu"><summary id="conversationMenuLabel" aria-label="Conversation tools" title="Conversation tools">•••</summary><div class="conversation-menu-content"><div id="conversationTools"><input id="find" type="search" maxlength="200" aria-label="Search conversation" placeholder="Search conversation"><span id="findCount" role="status"></span><button id="pinned" type="button" aria-pressed="false">Pinned</button><button id="export" type="button">Export</button><button id="threadSettings" type="button" aria-expanded="false">Manage</button><button id="clear" type="button">Clear</button></div><section id="threadEditor" hidden><label id="threadNameLabel" for="threadName">Conversation name</label><input id="threadName" maxlength="200"><div><button id="renameThread" type="button">Rename</button><button id="deleteThread" type="button">Delete</button></div></section></div></details></div>
<p id="workspaceError" role="status"></p><div id="log" role="log" aria-live="polite"></div><button id="latest" type="button" hidden>Latest reply ↓</button><div id="suggestions"></div>
<section id="review" hidden><p id="reviewText"></p><button id="reviewConfirm" type="button">Continue</button><button id="reviewCancel" type="button">Cancel</button></section>
<div id="tools"><select id="scope" aria-label="Transcript context"><option value="nearby">Nearby</option><option value="watched">Watched</option><option value="full">Full transcript</option></select></div>
<p id="delivery" role="status" aria-live="polite"></p><form id="form"><textarea id="text" rows="2" maxlength="16000" placeholder="Ask a question…" aria-label="Question"></textarea><div><small id="hint"></small><button id="cancel" type="button" hidden>Cancel</button><button id="retry" type="button" hidden>Retry</button><button id="send" type="submit">Send</button></div></form></section>
<script src="vendor/assistant-remend.js"></script><script src="assistant-overlay.js"></script></body></html>
