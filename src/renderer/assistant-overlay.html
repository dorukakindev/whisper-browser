<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="theme-palette.css">
<link rel="stylesheet" href="panel-system.css"><link rel="stylesheet" href="assistant-overlay.css"><link rel="stylesheet" href="ui-motion.css"><title>Assistant</title></head>
<body class="assistant-surface"><button id="bubble" aria-label="Open assistant" title="Assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-8 8H5l-3 2v-10a9 9 0 0 1 18 0Z"/><path d="M7 10h10M7 14h6"/></svg></button>
<section id="panel" hidden aria-label="Assistant">
<header><span class="assistant-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 11.5a8 8 0 0 1-8 8H5l-3 2v-10a9 9 0 0 1 18 0Z"/><path d="M7 10h10M7 14h6"/></svg></span><div><strong id="title">Assistant</strong><small id="context"></small><button id="openSource" class="source-return" type="button" hidden>Go to source</button></div><button id="expand" class="icon-button" title="Expand" aria-label="Expand">↗</button><button id="close" class="icon-button" title="Minimize" aria-label="Minimize">×</button></header>
<div id="assistantWorkspace"><details id="sourceBox"><summary id="sourceSummary"><span id="sourceLabel">Source &amp; model</span><span id="sourcePreview" hidden></span></summary><div class="source-detail-content"><div class="source-model"><small id="modelLabel">Active model</small><strong id="modelName"></strong></div><button id="assistantSettings" type="button">Assistant &amp; translation settings</button><div class="source-detail-description"><p id="sourcePreviewFull"></p><p id="sourceDescription"></p><p id="sourcePreviewDetail"></p></div></div></details>
<div id="threadBar"><select id="threads" aria-label="Conversation"></select><button id="newThread" type="button">New</button><details id="conversationMenu"><summary id="conversationMenuLabel" aria-label="Conversation tools" title="Conversation tools">•••</summary><div class="conversation-menu-content"><div id="conversationTools"><input id="find" type="search" maxlength="200" aria-label="Search conversation" placeholder="Search conversation"><span id="findCount" role="status"></span><button id="pinned" type="button" aria-pressed="false">Pinned</button><button id="export" type="button">Export</button><button id="threadSettings" type="button" aria-expanded="false">Manage</button><button id="clear" type="button">Clear</button></div><section id="threadEditor" hidden><label id="threadNameLabel" for="threadName">Conversation name</label><input id="threadName" maxlength="200"><div><button id="renameThread" type="button">Rename</button><button id="deleteThread" type="button">Delete</button></div></section></div></details></div>
<p id="workspaceError" role="status"></p><section id="agentProgress" class="assistant-progress" hidden aria-label="Assistant activity">
<div class="progress-orbit" aria-hidden="true"><svg viewBox="0 0 32 32"><circle class="orbit-track" cx="16" cy="16" r="12"/><circle class="orbit-arc" cx="16" cy="16" r="12"/></svg><span></span></div>
<div class="progress-copy"><div class="progress-top"><strong id="progressLabel" role="status" aria-live="polite"></strong><time id="progressElapsed" aria-hidden="true">0:00</time></div><span id="progressDetail"></span><div class="progress-steps" aria-hidden="true"><span data-stage="waiting"></span><span data-stage="tool"></span><span data-stage="writing"></span></div></div>
</section><details id="jobs" hidden><summary id="jobsLabel">Jobs</summary><div id="jobRows"></div></details>
<div id="log" role="log" aria-live="polite"></div><button id="latest" type="button" hidden>Latest reply ↓</button><div id="suggestions"><div id="primarySuggestion"></div><details id="suggestionMenu" hidden><summary id="suggestionMenuLabel">More suggestions</summary><div id="suggestionOptions"></div></details></div>
<section id="review" hidden><p id="reviewText"></p><button id="reviewConfirm" type="button">Continue</button><button id="reviewCancel" type="button">Cancel</button></section>
<div id="tools"><label for="scope" id="scopeLabel">Context scope</label><select id="scope" aria-label="Transcript context" aria-describedby="scopeHint"><option value="nearby">Nearby</option><option value="watched">Watched</option><option value="full">Full transcript</option></select><small id="scopeHint" class="context-scope-hint"></small></div>
<p id="delivery" role="status" aria-live="polite"></p></div><form id="form"><textarea id="text" rows="2" maxlength="16000" placeholder="Ask a question…" aria-label="Question"></textarea><section id="runtimeControls" hidden><button id="steer" type="button">Steer now</button><button id="followup" type="button">After this answer</button><small id="runtimeMessageStatus" role="status"></small></section><div><small id="hint"></small><button id="cancel" type="button" hidden>Cancel</button><button id="retry" type="button" hidden>Retry</button><button id="webSearch" type="button">Web search</button><button id="send" type="submit">Send</button></div></form></section>
<script src="ui-motion.js"></script><script src="assistant-focus-return.js"></script><script src="vendor/assistant-remend.js"></script><script src="../assistant-job-diagnostics.js"></script><script src="../assistant-run-steps.js"></script><script src="assistant-run-card.js"></script><script src="assistant-overlay.js"></script></body></html>
