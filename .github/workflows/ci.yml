name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-ci.txt
      - name: Run test suite
        env:
          WHISPER_TEST_PYTHON: python
          WHISPER_TEST_FFMPEG: ffmpeg
          WHISPER_TEST_FFPROBE: ffprobe
        run: npm test
      - name: Check syntax
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer/renderer.js
          python -m py_compile backend/transcribe.py backend/media.py
